<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7"/>
      <stop offset="100%" style="stop-color:#00D2FF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A29BFE"/>
      <stop offset="100%" style="stop-color:#74B9FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer portal ring -->
  <ellipse cx="256" cy="256" rx="140" ry="140" fill="none" stroke="url(#ring)" stroke-width="16" opacity="0.5"/>
  <ellipse cx="256" cy="256" rx="100" ry="100" fill="none" stroke="#fff" stroke-width="8" opacity="0.8"/>
  <!-- Inner glow -->
  <circle cx="256" cy="256" r="60" fill="#fff" opacity="0.15"/>
  <!-- Arrow going through portal -->
  <path d="M200 256 L280 256 M260 236 L280 256 L260 276" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Small sparkles -->
  <circle cx="180" cy="180" r="6" fill="#fff" opacity="0.6"/>
  <circle cx="340" cy="190" r="4" fill="#fff" opacity="0.4"/>
  <circle cx="330" cy="330" r="5" fill="#fff" opacity="0.5"/>
  <circle cx="170" cy="320" r="3" fill="#fff" opacity="0.3"/>
</svg>
