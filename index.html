<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- 1. PRIMARY SEO & ENCODING -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Portal — Instant File & Text Sharing, No Login Required</title>
    <meta name="description" content="Share files and text instantly between devices. Zero accounts, no installs, ephemeral rooms, and zero-persistence data sync. Powered by real-time WebSockets." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://portal-share.onrender.com/" />
    
    <!-- 2. OPEN GRAPH (For rich previews on WhatsApp, Discord, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portal-share.onrender.com/" />
    <meta property="og:title" content="Portal — Instant File & Text Sharing, No Login Required" />
    <meta property="og:description" content="Share files and text instantly between devices. Zero accounts, no installs, ephemeral rooms, and zero-persistence data sync." />
    <meta property="og:image" content="https://portal-share.onrender.com/portal-og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Portal Application Interface Preview" />
    <meta property="og:site_name" content="Portal" />
    <meta property="og:locale" content="en_US" />

    <!-- 3. TWITTER / X CARD TAGS -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Portal — Instant File & Text Sharing, No Login Required" />
    <meta name="twitter:description" content="Share files and text instantly between devices. Zero accounts, no installs, ephemeral rooms, and zero-persistence data sync." />
    <meta name="twitter:image" content="https://portal-share.onrender.com/portal-og-preview.png" />
    <meta name="twitter:image:alt" content="Portal Application Interface Preview" />

    <!-- 4. FAVICONS & PWA SETTINGS -->
    <link rel="icon" type="image/svg+xml" href="/portal-icon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Portal" />

    <!-- 5. FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
